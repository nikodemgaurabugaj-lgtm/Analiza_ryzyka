[project]
name = "floodnmt"
version = "1.0.0"
description = "Automatyczna ocena zasięgu zalewu z numerycznego modelu terenu (HAND + połączona wanna)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FalaNMT" }]
dependencies = [
  "rasterio>=1.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyflwdir>=0.5.8",
  "typer>=0.12",
  "matplotlib>=3.8",
  "streamlit>=1.32",
  "pillow>=10.0",
  "rich>=13.0",
  "jinja2>=3.1",
  "affine>=2.4",
  "folium>=0.16",
  "streamlit-folium>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
floodnmt = "floodnmt.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
